name: backend-tests

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Scans the pinned dependencies for known CVEs (backs the Security doc's
      # "automated dependency scanning" control). Non-blocking for now
      # (continue-on-error) so a newly-disclosed CVE surfaces as a warning
      # rather than blocking unrelated PRs; tighten to blocking once the
      # baseline is clean.
      - name: Audit dependencies
        continue-on-error: true
        run: pip-audit -r requirements.txt
