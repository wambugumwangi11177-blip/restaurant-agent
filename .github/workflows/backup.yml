name: db-backup

# OPT-IN, OFF-PROVIDER backup of production Postgres to AWS S3.
#
# NOT the primary backup. The primary is the Railway cron service in
# backend/scripts/backup/, which dumps to a Railway bucket nightly and needs no
# credentials from anyone — see backend/DISASTER_RECOVERY.md.
#
# This one exists for a failure the primary cannot survive: the Railway account
# itself being lost, compromised or closed. The database and the bucket live
# with the same provider, so a copy somewhere else is the only defence against
# losing both at once. Worth enabling before the data is irreplaceable; not
# worth blocking on today.
#
# The nightly schedule was REMOVED deliberately. Without the secrets below it
# failed every night at 03:17 UTC, and a backup job that is always red teaches
# everyone to ignore it — including on the night it is red for a real reason.
# Re-add the `schedule:` block once the secrets exist.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL          — ideally a read-only DB role
#   BACKUP_S3_BUCKET
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (or an OIDC role instead)
on:
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: bash backend/scripts/backup_db.sh
