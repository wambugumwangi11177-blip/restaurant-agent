name: ci

on:
  push:
    branches: ["main", "master", "review/**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite (with coverage)
        # pytest-cov is a CI-only tool (kept out of requirements.txt so it never
        # ships in the runtime image). Coverage is MEASURED and printed, not yet
        # gated on a threshold — we establish the real number before setting a
        # --cov-fail-under floor, so the gate reflects reality instead of a guess.
        run: |
          pip install pytest-cov
          pytest -v --cov=. --cov-report=term-missing --cov-report=xml

  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # BLOCKING as of 2026-07-08 (was continue-on-error): a newly-disclosed CVE
      # in any dependency now fails the build instead of printing a warning
      # nobody reads. The baseline was first driven clean — python-multipart,
      # python-dotenv, requests and pytest were bumped to their fix versions.
      #
      # Six advisories remain and are ignored EXPLICITLY, by id, each for a
      # reason — never with a blanket continue-on-error, so a NEW starlette or
      # ecdsa CVE still blocks:
      #
      #   PYSEC-2026-161 / -248 / -249, CVE-2026-48817 / -48818 (starlette)
      #     All fixes require starlette >= 1.0. fastapi 0.128.8 pins
      #     `starlette < 1.0.0`, so they cannot be taken without a fastapi major
      #     upgrade — tracked separately, not smuggled into a hardening pass.
      #
      #   PYSEC-2026-1325 (ecdsa, a python-jose transitive dep)
      #     A timing side-channel (Minerva) in ECDSA verification, with NO fix
      #     version published. Not reachable here: auth.py signs and verifies
      #     JWTs with HS256 (symmetric HMAC); the ECDSA code path is never
      #     executed. Revisit if the token algorithm ever changes.
      #
      # When any of these gains a fix that fits our constraints, bump the pin and
      # delete its --ignore-vuln line. Do not add new ids without a comment.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818 \
            --ignore-vuln PYSEC-2026-1325

  sast:
    # Static application security testing for the Python code (complements the
    # dependency-audit job, which only covers third-party CVEs). Runs at
    # medium-and-above severity (-ll): the low band is mostly assert/try-pass
    # noise, while medium+ is the high-signal set. Currently BLOCKING and clean —
    # the one medium finding (0.0.0.0 bind, required in-container) carries an
    # inline `# nosec B104` with justification. A new medium/high finding fails CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit SAST
        run: bandit -r . -ll -x ./tests,./alembic,./.venv

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # JS dependency audit — the Python deps are audited (pip-audit) but the
      # frontend's were not. BLOCKING as of 2026-07-11 (was continue-on-error):
      # the baseline was verified clean at --audit-level=high on that date
      # (`npm audit --audit-level=high` exits 0; only 4 *moderate* transitive
      # advisories via next-auth remain, below the gate). A NEW high/critical
      # advisory now fails CI instead of printing a warning nobody reads —
      # mirroring how pip-audit was made blocking on 2026-07-08.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      # Type errors and build breaks currently only surface on a Vercel deploy —
      # too late, and Vercel does not catch the untyped `json()` contract drifts
      # that broke /ai-dashboard against the live API (deleted 2026-07-08).
      # tsc runs after the build so it typechecks against Next's generated route
      # types, not a stale `.next/` from a previous run.
      - name: Build
        run: npm run build

      - name: Owner interaction regression tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  gitleaks:
    # Secret scanning — catches an API key / token / password committed to the
    # repo before it reaches history. Complements pip-audit/bandit (which cover
    # dependency + code vulns, not leaked credentials). Scoped to the PR diff /
    # pushed commits by the action's default behaviour, so it doesn't re-flag
    # the whole existing history on every run. Blocking: a leaked secret should
    # stop the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history to resolve the commit range

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container-scan:
    # Scans the actual backend image for OS/package CVEs (Trivy) — a layer the
    # source-level scanners (bandit, pip-audit) don't cover, e.g. a vulnerable
    # system lib in the python:3.12-slim base. Introduced NON-BLOCKING
    # (continue-on-error), exactly as pip-audit and bandit were before they were
    # driven clean and pinned: the base-image baseline needs triage first. Flip
    # continue-on-error to false (and pin/justify any accepted CVEs by id, like
    # the dependency-audit job does) once that triage is done.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t restaurant-agent-backend:ci ./backend

      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: restaurant-agent-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  owner-postgres-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_owner_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: release-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      OWNER_POSTGRES_TEST_URL: postgresql://postgres:release-test-only@127.0.0.1:5432/test_owner_release
      DATABASE_URL: postgresql://postgres:release-test-only@127.0.0.1:5432/test_owner_release
      SECRET_KEY: ci-owner-release-test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: release-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify migration paths and concurrent decisions on PostgreSQL
        run: pytest -v tests/test_owner_postgres.py
      - name: Restore synthetic backup into a separate database
        run: |
          pg_dump --format=custom --dbname=test_owner_release --file=/tmp/owner-release.dump
          createdb test_owner_restore
          pg_restore --exit-on-error --no-owner --dbname=test_owner_restore /tmp/owner-release.dump
          test "$(psql -At --dbname=test_owner_restore -c 'SELECT count(*) FROM attention_decisions')" = "1"
          test "$(psql -At --dbname=test_owner_restore -c 'SELECT sum(total) FROM orders WHERE is_paid')" = "12345"
