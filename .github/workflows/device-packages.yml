name: Device packages (LEVIII Store debug APK)
on:
  push:
    branches:
      - feat/jack-storekeeper
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Public HTTPS origin of the Railway frontend, no path. Production default is the leviii frontend service.'
        required: true
        default: 'https://frontend-production-e251.up.railway.app'
        type: string
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging
    env:
      LEVIII_APP_URL: ${{ inputs.app_url || 'https://frontend-production-e251.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packaging/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept the Android SDK licenses
        run: |
          sdkmanager=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" /usr/local/lib/android/sdk -path '*/cmdline-tools/*/bin/sdkmanager' -type f 2>/dev/null | head -1)
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
      - run: npm ci
      - run: npm test
      - run: npm run configure
      - run: npm run android:init
      - run: npm run android:sync
      - run: npm run android:apply
      - run: ./gradlew assembleDebug
        working-directory: packaging/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: LEVIII-Store-debug
          path: packaging/android/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish the stable APK
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          apk=$(find packaging/android/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          cp "$apk" "$RUNNER_TEMP/LEVIII-Store.apk"
          notes="Debug build of LEVIII Store. The /get page and the in-app update check use this file. Running this workflow again replaces it."
          if gh release view leviii-store >/dev/null 2>&1; then
            gh release upload leviii-store "$RUNNER_TEMP/LEVIII-Store.apk" --clobber
          else
            gh release create leviii-store "$RUNNER_TEMP/LEVIII-Store.apk" --title "LEVIII Store" --notes "$notes"
          fi
