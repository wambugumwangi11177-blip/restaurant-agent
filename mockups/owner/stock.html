<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store & Suppliers — LEVIII Owner</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="stock">
  <div class="app-shell">
    <header class="page-header">
      <h1 class="page-header__title">Stock</h1>
      <div class="page-header__actions">
        <a href="alerts.html" class="icon-btn" aria-label="Alerts">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16l-2-2"/><path d="M10 20a2 2 0 004 0"/></svg>
        </a>
        <a href="settings.html" class="profile-circle" aria-label="Profile">E</a>
      </div>
    </header>
    <main class="page-content">
      <h2 class="section-label" style="margin-top:0">To order</h2>
      <div class="warning-strip" data-bind="stock.recipeStrip"></div>
      <div class="card" id="to-order-list"></div>

      <h2 class="section-label">Running low</h2>
      <div class="card" id="running-low"></div>
      <div class="card">
        <div class="chart-wrap">
          <svg viewBox="0 0 320 100" role="img" aria-label="Chicken quarters on shelf">
            <line x1="20" y1="25" x2="300" y2="25" stroke="#000" stroke-dasharray="4 3"/>
            <line x1="20" y1="45" x2="300" y2="45" stroke="#757575" stroke-dasharray="4 3"/>
            <polyline fill="none" stroke="#000" stroke-width="2" points="20,70 60,65 100,58 140,50 180,42 220,38 260,35"/>
            <text x="22" y="22" font-size="9">Full shelf</text>
            <text x="22" y="42" font-size="9">Reorder</text>
          </svg>
        </div>
        <p class="chart-caption" data-bind="stock.chickenChartCaption"></p>
        <p class="freshness-line" data-bind="stock.freshness"></p>
      </div>

      <h2 class="section-label">Missing stock</h2>
      <p class="caption" data-bind="stock.missingCaption"></p>
      <div id="missing-stock"></div>

      <h2 class="section-label">Spoiled and wasted this week</h2>
      <div class="card" id="spoiled-list"></div>

      <h2 class="section-label">Suppliers</h2>
      <div class="card" id="supplier-scores"></div>

      <h2 class="section-label">Stock value</h2>
      <div class="card card-dark">
        <p class="card__number" data-bind="stock.stockValue" data-format="kes"></p>
        <p class="freshness-line" data-bind="stock.freshness"></p>
        <p style="margin-top:var(--space-3);font-size:0.875rem">Slow movers</p>
        <ul id="slow-movers"></ul>
      </div>

      <h2 class="section-label">Tomorrow's prep</h2>
      <div class="collapsible">
        <button type="button" class="collapsible__head" data-collapsible>
          <span>Prep and market list for <span data-bind="stock.prep.day"></span></span>
          <span aria-hidden="true">▼</span>
        </button>
        <div class="collapsible__body" id="prep-body"></div>
      </div>
    </main>
    <nav class="nav-pill" aria-label="Main">
      <a href="home.html" class="nav-pill__item" data-nav="home"><span class="nav-pill__icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1v-9.5z"/></svg></span><span class="nav-pill__label">Home</span></a>
      <a href="money.html" class="nav-pill__item" data-nav="money"><span class="nav-pill__icon-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 10h4a2 2 0 110 4h-2"/></svg></span><span class="nav-pill__label">Money</span></a>
      <a href="stock.html" class="nav-pill__item" data-nav="stock"><span class="nav-pill__icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4z"/><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span><span class="nav-pill__label">Stock</span></a>
      <a href="ask.html" class="nav-pill__item" data-nav="ask"><span class="nav-pill__icon-wrap"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H7l-3 3V6z"/></svg></span><span class="nav-pill__label">Ask</span></a>
      <a href="more.html" class="nav-pill__item" data-nav="more"><span class="nav-pill__icon-wrap"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></span><span class="nav-pill__label">More</span></a>
    </nav>
  </div>
  <div id="sheet-overlay" class="sheet-overlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet__handle"></div>
      <h2 class="sheet__title"></h2>
      <div class="sheet__body"></div>
      <button type="button" class="button button-block" data-sheet-close>Close</button>
    </div>
  </div>
  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    (function () {
      var D = window.LEVIII_DATA;
      var orderRoot = document.getElementById("to-order-list");
      D.stock.toOrder.forEach(function (o) {
        var row = document.createElement("div");
        row.className = "order-row";
        row.innerHTML =
          '<div><strong>' + o.item + '</strong> ' + o.qty + '<br>' + o.supplier + ' · ' + D.formatKES(o.cost) + ' · needed by ' + o.neededBy + '</div>' +
          '<div class="order-row__actions"><button type="button" class="button" data-approve-order>Approve</button>' +
          '<button type="button" class="button button-outline hidden" data-send-supplier>Send to supplier</button></div>';
        orderRoot.appendChild(row);
      });
      var low = document.getElementById("running-low");
      D.stock.runningLow.forEach(function (item) {
        var cls = item.status === "Low" ? "low" : "fine";
        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="row__label">' + item.item + ' · ' + item.daysLeft + ' days left</span>' +
          '<span class="status-word status-word--' + cls + '"><span class="status-word__shape"></span>' + item.status + '</span>';
        low.appendChild(row);
      });
      var miss = document.getElementById("missing-stock");
      D.stock.missingStock.forEach(function (m) {
        var card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          '<p class="card__sentence">Missing stock: ' + m.item + '.</p>' +
          '<p class="card__number">' + m.gap + ', about ' + D.formatKES(m.kes) + '</p>' +
          '<p style="font-size:0.875rem">Store sent ' + m.store + '. Kitchen confirmed ' + m.kitchen + '.</p>' +
          (m.initiatedBy ? '<p class="caption">' + m.initiatedBy + (m.confirmedBy ? ' → ' + m.confirmedBy : '') + '</p>' : '') +
          (m.handover ? '<p class="status-word status-word--check"><span class="status-word__shape"></span> ' + (m.transferStatus || "Handover doesn't match") + '</p>' : '') +
          '<p class="freshness-line">' + m.note + '</p>' +
          '<button type="button" class="button">Check this</button>' +
          '<button type="button" class="why-link" data-why data-why-title="How this was worked out" data-why-body="Deterministic variance: theoretical usage from recipes and sales vs recorded stock movements and transfer confirms (POST /stock/transfers/…/confirm).">Why?</button>';
        miss.appendChild(card);
      });
      var sp = document.getElementById("spoiled-list");
      D.stock.spoiled.forEach(function (s) {
        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="row__label">' + s.item + '</span><span class="row__value">' + D.formatKES(s.kes) + '</span>';
        sp.appendChild(row);
      });
      var sup = document.getElementById("supplier-scores");
      D.stock.suppliers.forEach(function (s) {
        var row = document.createElement("div");
        row.className = "row";
        row.innerHTML = '<span class="row__label"><strong>' + s.name + '</strong><br><span class="caption">' + s.short + ' · ' + s.price + '</span></span>';
        sup.appendChild(row);
      });
      var sm = document.getElementById("slow-movers");
      D.stock.slowMovers.forEach(function (name) {
        var li = document.createElement("li");
        li.textContent = name;
        sm.appendChild(li);
      });
      var prep = document.getElementById("prep-body");
      var html = "<p><strong>Prep</strong></p><ul>";
      D.stock.prep.plates.forEach(function (p) { html += "<li>" + p.dish + ": " + p.qty + "</li>"; });
      html += "</ul><p><strong>Market list</strong></p><ul>";
      D.stock.prep.market.forEach(function (m) { html += "<li>" + m + "</li>"; });
      html += "</ul><p class=\"freshness-line\">Updated just now</p>";
      prep.innerHTML = html;
    })();
  </script>
</body>
</html>
